name: Sync GitHub Profile Metrics and WakaTime

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # lowlighter/metrics action
      - name: Generate Profile Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Use your developer token (created and added under Secrets as METRICS_TOKEN)
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          
          # Language distribution
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          
          # WakaTime integration
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, projects, languages, editors, os
          plugin_wakatime_limit: 5
          
          # Output configuration
          filename: github-metrics-profile.svg
          
      # Alternative lightweight WakaTime-specific sync inside README markdown between markers
      - name: Update WakaTime Weekly Leaderboard in README
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_OS: "true"
          SHOW_PROJECTS: "true"
          SHOW_EDITORS: "true"
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          SECTION_NAME: "wakatime"
          COMMIT_MESSAGE: "chore: update wakatime coder metrics leaderboard"
          TARGET_BRANCH: "main"
